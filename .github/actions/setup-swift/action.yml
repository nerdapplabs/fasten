name: Set up Swift
description: Install a Swift release from swift.org on Ubuntu 24.04 and check its signature.

# The steps swift.org gives for installing a release tarball: import the
# swift.org keys, check the tarball's signature, unpack it.
inputs:
  version:
    description: Swift release, for example 5.10.1
    required: true

runs:
  using: composite
  steps:
    - name: Install Swift ${{ inputs.version }}
      shell: bash
      env:
        SWIFT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        name="swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04"
        url="https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2404/swift-${SWIFT_VERSION}-RELEASE/${name}.tar.gz"
        cd "$RUNNER_TEMP"
        curl -fsSL --retry 5 --retry-all-errors -o swift.tar.gz "$url"
        curl -fsSL --retry 5 --retry-all-errors -o swift.tar.gz.sig "$url.sig"
        curl -fsSL --compressed --retry 5 --retry-all-errors https://www.swift.org/keys/all-keys.asc | gpg --batch --quiet --import
        gpg --batch --verify swift.tar.gz.sig swift.tar.gz
        tar -xzf swift.tar.gz
        echo "$RUNNER_TEMP/$name/usr/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/$name/usr/bin/swift" --version
