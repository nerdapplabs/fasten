name: Release provenance

# Builds the files attached to each GitHub release, attests their build
# provenance and checks every attestation before anything is published.
# vX.Y.Z tags: Swift, C++ and Rust source archives and the fasten-core
# library. go/vX.Y.Z tags: the Go module zip.
on:
  push:
    tags:
      - 'v*'
      - 'go/v*'
  # A dry run: builds, attests and verifies v0.0.0-dryrun files from the
  # selected branch and publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # Sigstore signing certificate
      attestations: write   # store the attestations on the repo
    steps:
      - uses: actions/checkout@v6

      - name: Release tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then tag=$REF_NAME; else tag=v0.0.0-dryrun; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build fasten-core
        if: ${{ !startsWith(steps.tag.outputs.tag, 'go/') }}
        # Same image and command as the Rust SDK workflow.
        run: |
          docker run --rm -v "$PWD:/src" -w /src/fasten-core rust:1.90 sh -ec '
            apt-get update -qq
            apt-get install -y -qq pkg-config libssl-dev
            cargo build --release --locked --features all'

      - name: Build release files
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          case $TAG in
            go/*) scripts/release/build-artifacts.sh "$TAG" dist ;;
            *) scripts/release/build-artifacts.sh "$TAG" dist fasten-core/target/release ;;
          esac

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Verify checksums and attestations
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS
          for f in *; do
            gh attestation verify "$f" \
              --repo "$GITHUB_REPOSITORY" \
              --source-ref "$GITHUB_REF" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-provenance.yml"
          done

  publish:
    needs: verify
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload its files
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # all tags, to pick the latest release
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            pre=()
            case $TAG in *-*) pre=(--prerelease) ;; esac
            # Only the highest vX.Y.Z tag becomes the repo's latest release.
            latest=$(git tag -l 'v*' | scripts/release/latest-flag.sh "$TAG")
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TAG" "${pre[@]}" --latest="$latest" \
              --notes "Verify these files with the steps in SECURITY.md (Verifying a release)."
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
