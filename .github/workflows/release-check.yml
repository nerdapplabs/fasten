name: Release files

on:
  push:
    branches: [main, dev]
    paths:
      - 'scripts/release/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-check.yml'
      - 'swift/**'
      - 'cpp/include/**'
      - 'rust/**'
      - 'fasten-core/**'
      - 'go/**'
      - 'rust-toolchain.toml'
      - 'js/**'
      - 'tests/integration/**'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    paths:
      - 'scripts/release/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-check.yml'
      - 'swift/**'
      - 'cpp/include/**'
      - 'rust/**'
      - 'fasten-core/**'
      - 'go/**'
      - 'rust-toolchain.toml'
      - 'js/**'
      - 'tests/integration/**'
      - 'LICENSE'
      - 'NOTICE'

permissions:
  contents: read

jobs:
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build twice and compare
        run: scripts/release/check-reproducible.sh

      - name: Latest release choice
        run: scripts/release/test-latest-flag.sh

      - name: Tag and package versions
        run: scripts/release/test-check-version.sh

      - name: Published fasten-core matches the tree
        run: scripts/release/test-core-published.sh

      - name: Files on PyPI match the build
        run: scripts/release/test-pypi-check.sh

      - name: Tarball on npm matches the build
        run: scripts/release/test-npm-check.sh

      - name: GitHub release upload
        run: scripts/release/test-gh-release.sh

  # The release workflow's install check: the npm tarball and the packaged
  # crates, installed outside the repo, run the integration smoke.
  install-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: node
            image: node:24-alpine@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5  # node:24-alpine, pinned by digest
          - package: rust
            image: rust:1.90
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install bash and python3
        if: ${{ matrix.package == 'node' }}
        run: apk add --no-cache bash python3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the package and run the smoke
        run: scripts/release/install-check.sh ${{ matrix.package }}
