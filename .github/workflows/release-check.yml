name: Release files

on:
  push:
    branches: [main, dev]
    paths:
      - 'scripts/release/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-check.yml'
      - 'swift/**'
      - 'cpp/include/**'
      - 'rust/**'
      - 'fasten-core/**'
      - 'go/**'
      - 'rust-toolchain.toml'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    paths:
      - 'scripts/release/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-check.yml'
      - 'swift/**'
      - 'cpp/include/**'
      - 'rust/**'
      - 'fasten-core/**'
      - 'go/**'
      - 'rust-toolchain.toml'
      - 'LICENSE'
      - 'NOTICE'

permissions:
  contents: read

jobs:
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build twice and compare
        run: scripts/release/check-reproducible.sh

      - name: Latest release choice
        run: scripts/release/test-latest-flag.sh

      - name: Tag and package versions
        run: scripts/release/test-check-version.sh

      - name: Published fasten-core matches the tree
        run: scripts/release/test-core-published.sh
