name: JS SDK

on:
  # Restrict push to main + dev so PR branches don't run the suite
  # twice (once for push, once for pull_request) on every commit.
  push:
    branches: [main, dev]
    paths:
      - 'js/**'
      - '.github/workflows/fasten-js.yml'
  pull_request:
    paths:
      - 'js/**'
      - '.github/workflows/fasten-js.yml'

permissions:
  contents: read
  id-token: write   # required by codecov OIDC upload (tokenless for public repos)

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:24-alpine

    defaults:
      run:
        working-directory: js

    steps:
      - uses: actions/checkout@v6

      - name: Install dev deps
        # js-yaml is an optional peerDep / devDep — required by codes_yaml tests.
        run: npm install --no-audit --no-fund

      - name: Lint (biome)
        run: npx biome check src/

      - name: Unit tests with coverage
        run: npx c8 --reporter=lcov --reporter=text node --test 'test/**/*.test.mjs'

      - name: Install Codecov runtime deps
        run: apk add --no-cache bash git curl gpg

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: js/coverage/lcov.info
          flags: js
          fail_ci_if_error: false
