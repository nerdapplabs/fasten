name: JS SDK

on:
  push:
    branches: [main, dev]
    paths:
      - 'js/**'
      - 'fasten-core/**'
      - '.github/workflows/fasten-js.yml'
  pull_request:
    paths:
      - 'js/**'
      - 'fasten-core/**'
      - '.github/workflows/fasten-js.yml'

permissions:
  contents: read
  id-token: write   # required by codecov OIDC upload (tokenless for public repos)

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: js

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      - name: Build fasten-core (.so)
        working-directory: fasten-core
        run: cargo build --release --features all

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Lint (biome)
        run: npx biome check src/

      - name: Unit tests with coverage
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/fasten-core/target/release
        run: npx c8 --reporter=lcov --reporter=text node --test 'test/**/*.test.mjs'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: js/coverage/lcov.info
          flags: js
          fail_ci_if_error: false
