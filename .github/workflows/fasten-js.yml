name: JS SDK

on:
  push:
    branches: [main, dev]
    paths:
      - 'js/**'
      - 'spec/**'
      - '.github/workflows/fasten-js.yml'
  pull_request:
    paths:
      - 'js/**'
      - 'spec/**'
      - '.github/workflows/fasten-js.yml'

permissions:
  contents: read
  id-token: write   # required by codecov OIDC upload (tokenless for public repos)

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fasten
          POSTGRES_PASSWORD: fasten
          POSTGRES_DB: fasten_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fasten -d fasten_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: js

    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Lint (biome)
        run: npx biome check src/

      - name: Unit tests with coverage
        env:
          FASTEN_TEST_POSTGRES_DSN: postgresql://fasten:fasten@localhost:5432/fasten_test
        run: npx c8 --reporter=lcov --reporter=text node --test 'test/**/*.test.mjs'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: js/coverage/lcov.info
          flags: js
          fail_ci_if_error: false
