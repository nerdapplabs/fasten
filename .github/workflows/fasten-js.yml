name: JS SDK

on:
  push:
    branches: [main, dev]
    paths:
      - 'js/**'
      - 'spec/**'
      - '.github/workflows/fasten-js.yml'
  pull_request:
    paths:
      - 'js/**'
      - 'spec/**'
      - '.github/workflows/fasten-js.yml'
  workflow_call:

permissions:
  contents: read
  id-token: write   # required by codecov OIDC upload (tokenless for public repos)

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fasten
          POSTGRES_PASSWORD: fasten
          POSTGRES_DB: fasten_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fasten -d fasten_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: js

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Lint (biome)
        run: npx biome check src/

      - name: Unit tests with coverage
        env:
          FASTEN_TEST_POSTGRES_DSN: postgresql://fasten:fasten@localhost:5432/fasten_test
          # Fail, rather than skip, the Postgres tests if the DSN goes missing.
          FASTEN_REQUIRE_POSTGRES: '1'
        run: npx c8 --reporter=lcov --reporter=text node --test 'test/**/*.test.mjs'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: js/coverage/lcov.info
          flags: js
          fail_ci_if_error: false
