name: Spec codegen

# The generated blocks in the SDKs, the hand-written redaction key lists and
# fasten-core's replacement token must match spec/row-schema.json
# (spec/codegen.py --check).
on:
  push:
    branches: [main, dev]
    paths:
      - 'spec/**'
      - 'python/fasten/codes.py'
      - 'go/fasten.go'
      - 'js/src/index.js'
      - 'js/src/core.js'
      - 'rust/src/lib.rs'
      - 'cpp/include/fasten.hpp'
      - 'java/src/main/java/sh/fasten/Fasten.java'
      - 'fasten-core/src/redact.rs'
      - 'swift/Sources/Fasten/Redactor.swift'
      - 'swift/Sources/Fasten/Engine.swift'
      - 'swift/Sources/Fasten/Fasten.swift'
      - '.github/workflows/codegen.yml'
  pull_request:
    paths:
      - 'spec/**'
      - 'python/fasten/codes.py'
      - 'go/fasten.go'
      - 'js/src/index.js'
      - 'js/src/core.js'
      - 'rust/src/lib.rs'
      - 'cpp/include/fasten.hpp'
      - 'java/src/main/java/sh/fasten/Fasten.java'
      - 'fasten-core/src/redact.rs'
      - 'swift/Sources/Fasten/Redactor.swift'
      - 'swift/Sources/Fasten/Engine.swift'
      - 'swift/Sources/Fasten/Fasten.swift'
      - '.github/workflows/codegen.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generated blocks and key lists match the spec
        run: python3 spec/codegen.py --check

      - name: The key list reader
        run: python3 -m unittest spec/test_codegen.py
