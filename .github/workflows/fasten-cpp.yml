name: C++ SDK

on:
  push:
    branches: [main, dev]
    paths:
      - 'cpp/**'
      - 'fasten-core/**'
      - '.github/workflows/fasten-cpp.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - 'fasten-core/**'
      - '.github/workflows/fasten-cpp.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fasten
          POSTGRES_PASSWORD: fasten
          POSTGRES_DB: fasten_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fasten -d fasten_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Read toolchain from rust-toolchain.toml
        id: rust-toolchain-file
        run: |
          ch=$(grep -oE 'channel = "[0-9.]+"' rust-toolchain.toml | grep -oE '[0-9.]+')
          [ -n "$ch" ] || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$ch" >> "$GITHUB_OUTPUT"
          echo "toolchain: $ch"

      - name: Install Rust (rust-toolchain.toml)
        # dtolnay/rust-toolchain requires an explicit `toolchain` input — it
        # does NOT read rust-toolchain.toml. Read the channel from that file
        # and pass it, so the file stays the single source of truth and the
        # four workflows that build fasten-core cannot drift apart again.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain-file.outputs.channel }}

      - name: Build fasten-core (.so)
        working-directory: fasten-core
        run: cargo build --release --locked --features all

      - name: Install C++ build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libyaml-cpp-dev libsqlite3-dev libpq-dev

      - name: Configure
        working-directory: cpp
        run: >
          cmake -S . -B build
          -DFASTEN_BUILD_TESTS=ON
          -DFASTEN_BUILD_EXAMPLES=ON
          -DFASTEN_CORE_LIB_DIR=${{ github.workspace }}/fasten-core/target/release

      - name: Build
        working-directory: cpp
        run: cmake --build build --parallel

      - name: Run tests
        working-directory: cpp
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/fasten-core/target/release
          FASTEN_TEST_POSTGRES_DSN: postgresql://fasten:fasten@localhost:5432/fasten_test
        run: ctest --test-dir build --output-on-failure
