name: C++ SDK

on:
  push:
    branches: [main, dev]
    paths:
      - 'cpp/**'
      - 'fasten-core/**'
      - '.github/workflows/fasten-cpp.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - 'fasten-core/**'
      - '.github/workflows/fasten-cpp.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      - name: Build fasten-core (.so)
        working-directory: fasten-core
        run: cargo build --release --features all

      - name: Install C++ build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libyaml-cpp-dev libsqlite3-dev

      - name: Configure
        working-directory: cpp
        run: >
          cmake -S . -B build
          -DFASTEN_BUILD_TESTS=ON
          -DFASTEN_BUILD_EXAMPLES=ON
          -DFASTEN_CORE_LIB_DIR=${{ github.workspace }}/fasten-core/target/release

      - name: Build
        working-directory: cpp
        run: cmake --build build --parallel

      - name: Run tests
        working-directory: cpp
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/fasten-core/target/release
        run: ctest --test-dir build --output-on-failure
