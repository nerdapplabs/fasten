name: Rust SDK

on:
  push:
    branches: [main, dev]
    paths:
      - 'rust/**'
      # fasten-core's own tests run only in this workflow.
      - 'fasten-core/**'
      - '.github/workflows/fasten-rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      # fasten-core's own tests run only in this workflow.
      - 'fasten-core/**'
      - '.github/workflows/fasten-rust.yml'

permissions:
  contents: read
  id-token: write   # required by codecov OIDC upload (tokenless for public repos)

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: rust:1.90

    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v6

      - name: Toolchain declarations agree
        # Both files are read from the repo root, not the job default
        # working-directory (rust).
        working-directory: ${{ github.workspace }}
        run: |
          tc=$(grep -oE 'channel = "[0-9.]+"' rust-toolchain.toml | grep -oE '[0-9.]+')
          mv=$(grep -oE 'rust-version = "[0-9.]+"' fasten-core/Cargo.toml | grep -oE '[0-9.]+')
          echo "rust-toolchain.toml=$tc  fasten-core rust-version=$mv"
          [ "$tc" = "$mv" ] || { echo "::error::toolchain and rust-version disagree"; exit 1; }

      - name: Install clippy
        run: rustup component add clippy

      - name: Lint (clippy)
        # --locked builds with the committed Cargo.lock instead of resolving
        # newer transitive versions.
        run: cargo clippy --locked -- -D warnings

      - name: Unit tests
        run: cargo test --locked --quiet

      # rust/ depends on fasten-core with default-features = false, so its
      # tests never compile store/postgres.rs. Run the core's own tests here
      # with all features so the TLS tests run.
      - name: Test fasten-core (all features)
        working-directory: fasten-core
        # native-tls needs pkg-config and the OpenSSL headers. The rust
        # container runs as root and has no sudo.
        run: |
          apt-get update -qq
          apt-get install -y -qq pkg-config libssl-dev
          cargo test --all-features --locked --quiet

      - name: Install llvm-tools for coverage
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage
        run: cargo llvm-cov --locked --lcov --output-path coverage.lcov

      - name: Install Codecov runtime deps
        run: apt-get update -qq && apt-get install -y --no-install-recommends gpg

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: rust/coverage.lcov
          flags: rust
          fail_ci_if_error: false
