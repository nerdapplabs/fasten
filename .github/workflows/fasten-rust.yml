name: Rust SDK

on:
  push:
    branches: [main, dev]
    paths:
      - 'rust/**'
      # fasten-core's own tests run only in this workflow.
      - 'fasten-core/**'
      - '.github/workflows/fasten-rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      # fasten-core's own tests run only in this workflow.
      - 'fasten-core/**'
      - '.github/workflows/fasten-rust.yml'

permissions:
  contents: read
  id-token: write   # required by codecov OIDC upload (tokenless for public repos)

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: rust:1.90

    # The job runs in a container, so the service is reached by name.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fasten
          POSTGRES_PASSWORD: fasten
          POSTGRES_DB: fasten_test
        options: >-
          --health-cmd "pg_isready -U fasten -d fasten_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v6

      - name: Toolchain declarations agree
        # Both files are read from the repo root, not the job default
        # working-directory (rust).
        working-directory: ${{ github.workspace }}
        run: |
          tc=$(grep -oE 'channel = "[0-9.]+"' rust-toolchain.toml | grep -oE '[0-9.]+')
          mv=$(grep -oE 'rust-version = "[0-9.]+"' fasten-core/Cargo.toml | grep -oE '[0-9.]+')
          echo "rust-toolchain.toml=$tc  fasten-core rust-version=$mv"
          [ "$tc" = "$mv" ] || { echo "::error::toolchain and rust-version disagree"; exit 1; }

      - name: Install clippy
        run: rustup component add clippy

      - name: Lint (clippy)
        # --locked builds with the committed Cargo.lock instead of resolving
        # newer transitive versions.
        run: cargo clippy --locked --features store-postgres -- -D warnings

      - name: Unit tests
        env:
          FASTEN_TEST_POSTGRES_DSN: postgres://fasten:fasten@postgres:5432/fasten_test
        run: cargo test --locked --quiet --features store-postgres

      # rust/ depends on fasten-core with default-features = false, so its
      # tests never compile store/postgres.rs. Run the core's own tests here
      # with all features so the TLS tests run.
      - name: Test fasten-core (all features)
        working-directory: fasten-core
        # native-tls needs pkg-config and the OpenSSL headers. The rust
        # container runs as root and has no sudo.
        # Without the DSN the Postgres store tests return early and pass.
        env:
          FASTEN_TEST_POSTGRES_DSN: postgres://fasten:fasten@postgres:5432/fasten_test?sslmode=disable
        run: |
          apt-get update -qq
          apt-get install -y -qq pkg-config libssl-dev
          cargo test --all-features --locked --quiet

      - name: Install llvm-tools for coverage
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage
        run: cargo llvm-cov --locked --lcov --output-path coverage.lcov

      - name: Install Codecov runtime deps
        run: apt-get update -qq && apt-get install -y --no-install-recommends gpg

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: rust/coverage.lcov
          flags: rust
          fail_ci_if_error: false

  swift-binding:
    # The Swift binding in fasten-core/bindings/swift links libfasten_core.
    # setup-swift@v2 does not support Ubuntu 26.04 yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fasten
          POSTGRES_PASSWORD: fasten
          POSTGRES_DB: fasten_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fasten -d fasten_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Read toolchain from rust-toolchain.toml
        id: rust-toolchain-file
        run: |
          ch=$(grep -oE 'channel = "[0-9.]+"' rust-toolchain.toml | grep -oE '[0-9.]+')
          [ -n "$ch" ] || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$ch" >> "$GITHUB_OUTPUT"

      - name: Install Rust (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain-file.outputs.channel }}

      - name: Build fasten-core
        working-directory: fasten-core
        run: cargo build --release --locked --features all

      - name: Set up Swift 5.10
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      - name: Test
        working-directory: fasten-core/bindings/swift
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/fasten-core/target/release
          FASTEN_TEST_POSTGRES_DSN: postgres://fasten:fasten@localhost:5432/fasten_test?sslmode=disable
        run: swift test -Xlinker -L../../target/release
