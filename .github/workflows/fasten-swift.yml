name: Swift SDK

on:
  push:
    branches: [main, dev]
    paths:
      - 'swift/**'
      - 'store-core/**'
      - '.github/workflows/fasten-swift.yml'
  pull_request:
    paths:
      - 'swift/**'
      - 'store-core/**'
      - '.github/workflows/fasten-swift.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: swift:5.10

    defaults:
      run:
        working-directory: swift

    steps:
      - uses: actions/checkout@v6

      - name: Install system deps
        run: apt-get update -qq && apt-get install -y --no-install-recommends libsqlite3-dev curl ca-certificates

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      - name: Build fasten-core (.so)
        working-directory: store-core
        run: cargo build --release --features all

      - name: Build
        env:
          FASTEN_LIB: ${{ github.workspace }}/store-core/target/release
        run: swift build -Xlinker -L$FASTEN_LIB

      - name: Test
        env:
          FASTEN_LIB: ${{ github.workspace }}/store-core/target/release
          LD_LIBRARY_PATH: ${{ github.workspace }}/store-core/target/release
        run: swift test -Xlinker -L$FASTEN_LIB
