name: Swift SDK

on:
  push:
    branches: [main, dev]
    paths:
      - 'swift/**'
      - '.github/workflows/fasten-swift.yml'
  pull_request:
    paths:
      - 'swift/**'
      - '.github/workflows/fasten-swift.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: swift:5.10

    defaults:
      run:
        working-directory: swift

    steps:
      - uses: actions/checkout@v6

      - name: Install SQLite3 dev headers
        run: apt-get update -qq && apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Build
        run: swift build

      - name: Test
        run: swift test
