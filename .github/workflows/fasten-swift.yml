name: Swift SDK

on:
  push:
    branches: [main, dev]
    paths:
      - 'swift/**'
      - 'spec/**'
      - '.github/workflows/fasten-swift.yml'
      - '.github/actions/setup-swift/**'
  pull_request:
    paths:
      - 'swift/**'
      - 'spec/**'
      - '.github/workflows/fasten-swift.yml'
      - '.github/actions/setup-swift/**'
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # .github/actions/setup-swift installs the Ubuntu 24.04 build of Swift.
    runs-on: ubuntu-24.04
    # The job takes about a minute. The tests have hung on Linux arm64
    # (#160); without a limit a hang here would hold a release for 6 hours.
    timeout-minutes: 15

    defaults:
      run:
        working-directory: swift

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Swift 5.10.1
        uses: ./.github/actions/setup-swift
        with:
          version: "5.10.1"
          # Swift 5.x Release Signing Key
          key-fingerprint: "A62AE125BBBFBB96A6E042EC925CC1CCED3D1561"

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Build
        run: swift build

      - name: Test
        run: swift test
