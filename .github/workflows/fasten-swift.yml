name: Swift SDK

on:
  push:
    branches: [main, dev]
    paths:
      - 'swift/**'
      - 'spec/**'
      - '.github/workflows/fasten-swift.yml'
  pull_request:
    paths:
      - 'swift/**'
      - 'spec/**'
      - '.github/workflows/fasten-swift.yml'

permissions:
  contents: read

jobs:
  test:
    # .github/actions/setup-swift installs the Ubuntu 24.04 build of Swift.
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: swift

    steps:
      - uses: actions/checkout@v6

      - name: Set up Swift 5.10
        uses: ./.github/actions/setup-swift
        with:
          version: "5.10.1"

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Build
        run: swift build

      - name: Test
        run: swift test
