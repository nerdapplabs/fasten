name: Swift SDK

on:
  push:
    branches: [main, dev]
    paths:
      - 'swift/**'
      - 'spec/**'
      - '.github/workflows/fasten-swift.yml'
  pull_request:
    paths:
      - 'swift/**'
      - 'spec/**'
      - '.github/workflows/fasten-swift.yml'
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # setup-swift@v2 does not support Ubuntu 26.04 yet.
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: swift

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Swift 5.10
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "5.10"

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Build
        run: swift build

      - name: Test
        run: swift test
