name: Release Python SDK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read   # actions/checkout — without this, declaring any
                   # other permission silently demotes contents to none
                   # and the checkout step 404s.
  id-token: write  # required for Trusted Publishing OIDC exchange

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: python:3.10-slim

    environment:
      name: pypi
      url: https://pypi.org/p/fasten

    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
