name: Go SDK

on:
  push:
    branches: [main, dev]
    paths:
      - 'go/**'
      - 'fasten-core/**'
      - '.github/workflows/fasten-go.yml'
  pull_request:
    paths:
      - 'go/**'
      - 'fasten-core/**'
      - '.github/workflows/fasten-go.yml'

permissions:
  contents: read
  id-token: write   # required by codecov OIDC upload (tokenless for public repos)

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fasten
          POSTGRES_PASSWORD: fasten
          POSTGRES_DB: fasten_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fasten -d fasten_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Read toolchain from rust-toolchain.toml
        id: rust-toolchain-file
        run: |
          ch=$(grep -oE 'channel = "[0-9.]+"' rust-toolchain.toml | grep -oE '[0-9.]+')
          [ -n "$ch" ] || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$ch" >> "$GITHUB_OUTPUT"
          echo "toolchain: $ch"

      - name: Install Rust (rust-toolchain.toml)
        # dtolnay/rust-toolchain needs an explicit `toolchain` input and does not
        # read rust-toolchain.toml, so pass the channel read from that file.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain-file.outputs.channel }}

      - name: Build fasten-core (.so)
        working-directory: fasten-core
        run: cargo build --release --locked --features all

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Vet
        working-directory: go
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: -L${{ github.workspace }}/fasten-core/target/release
        run: go vet ./...

      - name: Unit + integration tests
        working-directory: go
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: -L${{ github.workspace }}/fasten-core/target/release
          LD_LIBRARY_PATH: ${{ github.workspace }}/fasten-core/target/release
          FASTEN_TEST_POSTGRES_DSN: postgres://fasten:fasten@localhost:5432/fasten_test?sslmode=disable
        run: go test -tags=integration -v -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: go/coverage.out
          flags: go
          fail_ci_if_error: false
