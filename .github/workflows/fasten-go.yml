name: Go SDK

on:
  # Restrict push to main + dev so PR branches don't run the suite
  # twice (once for push, once for pull_request) on every commit.
  push:
    branches: [main, dev]
    paths:
      - 'go/**'
      - '.github/workflows/fasten-go.yml'
  pull_request:
    paths:
      - 'go/**'
      - '.github/workflows/fasten-go.yml'

permissions:
  contents: read
  id-token: write   # required by codecov OIDC upload (tokenless for public repos)

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: golang:1.22-alpine

    defaults:
      run:
        working-directory: go

    steps:
      - uses: actions/checkout@v6

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        # -race requires CGO which is not available in golang:*-alpine (CGO_ENABLED=0)
        run: go test -v -count=1 -coverprofile=coverage.out ./...

      - name: Install Codecov runtime deps
        run: apk add --no-cache git curl gpg

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: go/coverage.out
          flags: go
          fail_ci_if_error: false
