name: Go SDK

on:
  push:
    branches: [main, dev]
    paths:
      - 'go/**'
      - 'fasten-core/**'
      - '.github/workflows/fasten-go.yml'
  pull_request:
    paths:
      - 'go/**'
      - 'fasten-core/**'
      - '.github/workflows/fasten-go.yml'

permissions:
  contents: read
  id-token: write   # required by codecov OIDC upload (tokenless for public repos)

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      - name: Build fasten-core (.so)
        working-directory: fasten-core
        run: cargo build --release --features all

      - name: Set up Go 1.22
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: Vet
        working-directory: go
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: -L${{ github.workspace }}/fasten-core/target/release
        run: go vet ./...

      - name: Unit tests
        working-directory: go
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: -L${{ github.workspace }}/fasten-core/target/release
          LD_LIBRARY_PATH: ${{ github.workspace }}/fasten-core/target/release
        run: go test -v -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: go/coverage.out
          flags: go
          fail_ci_if_error: false
