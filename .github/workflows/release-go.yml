name: Release Go SDK

# The module lives in go/, so its versions are go/vX.Y.Z tags.
on:
  push:
    tags:
      - 'go/v*'

permissions:
  contents: read
  id-token: write   # fasten-go.yml uploads coverage through Codecov OIDC

jobs:
  verify:
    uses: ./.github/workflows/fasten-go.yml

  published:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # pkg.go.dev serves Go modules from VCS tags; there is nothing to upload.
      - run: echo "Tag ${{ github.ref_name }} pushed; module github.com/nerdapplabs/fasten/go"
