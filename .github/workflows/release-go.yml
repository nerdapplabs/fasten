name: Release Go SDK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: golang:1.22-alpine

    defaults:
      run:
        working-directory: go

    steps:
      - uses: actions/checkout@v6

      # -race needs CGO, and the alpine image has no C compiler and
      # CGO_ENABLED=0 by default.
      - name: Install build toolchain (for CGO -race)
        run: apk add --no-cache build-base
      - name: Vet and test
        env:
          CGO_ENABLED: "1"
        run: |
          go vet ./...
          go test -v -race ./...

      - name: Tag published
        # Go modules are fetched from the VCS tag, so there is nothing to publish.
        # The module path is github.com/nerdapplabs/fasten/go.
        run: echo "Tag ${{ github.ref_name }} pushed — module available via pkg.go.dev"
