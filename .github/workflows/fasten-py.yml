name: Python SDK

on:
  push:
    branches: [main, dev]
    paths:
      - 'python/**'
      - 'fasten-core/**'
      - '.github/workflows/fasten-py.yml'
  pull_request:
    paths:
      - 'python/**'
      - 'fasten-core/**'
      - '.github/workflows/fasten-py.yml'

permissions:
  contents: read
  id-token: write   # required by codecov OIDC upload (tokenless for public repos)

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fasten
          POSTGRES_PASSWORD: fasten
          POSTGRES_DB: fasten_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fasten -d fasten_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.100

      - name: Build fasten-core (.so)
        working-directory: fasten-core
        run: cargo build --release --features all

      - name: Set FASTEN_CORE_LIB
        run: |
          echo "FASTEN_CORE_LIB=$GITHUB_WORKSPACE/fasten-core/target/release/libfasten_core.so" \
            >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dev dependencies
        run: |
          uv venv
          uv pip install -e ".[dev,postgres]"

      - name: Activate venv for subsequent steps
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint (ruff)
        run: ruff check fasten/

      - name: Type check (mypy)
        run: mypy fasten/

      - name: Unit tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/fasten-core/target/release
          FASTEN_TEST_POSTGRES_DSN: postgresql://fasten:fasten@localhost:5432/fasten_test
        run: pytest tests/ -v --tb=short --cov=fasten --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: python/coverage.xml
          flags: python
          fail_ci_if_error: false

      - name: Audit (pip-audit)
        run: pip-audit
