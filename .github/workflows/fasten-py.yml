name: Python SDK

on:
  push:
    branches: [main, dev]
    paths:
      - 'python/**'
      - 'fasten-core/**'
      - '.github/workflows/fasten-py.yml'
  pull_request:
    paths:
      - 'python/**'
      - 'fasten-core/**'
      - '.github/workflows/fasten-py.yml'

permissions:
  contents: read
  id-token: write   # required by codecov OIDC upload (tokenless for public repos)

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fasten
          POSTGRES_PASSWORD: fasten
          POSTGRES_DB: fasten_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fasten -d fasten_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v6

      - name: Read toolchain from rust-toolchain.toml
        id: rust-toolchain-file
        # Override the job default (working-directory: python) — the file is at
        # the REPO ROOT, and the inherited default makes grep fail with
        # "No such file or directory".
        working-directory: ${{ github.workspace }}
        run: |
          ch=$(grep -oE 'channel = "[0-9.]+"' rust-toolchain.toml | grep -oE '[0-9.]+')
          [ -n "$ch" ] || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$ch" >> "$GITHUB_OUTPUT"
          echo "toolchain: $ch"

      - name: Install Rust (rust-toolchain.toml)
        # dtolnay/rust-toolchain requires an explicit `toolchain` input — it
        # does NOT read rust-toolchain.toml. Read the channel from that file
        # and pass it, so the file stays the single source of truth and the
        # four workflows that build fasten-core cannot drift apart again.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain-file.outputs.channel }}

      - name: Build fasten-core (.so)
        working-directory: fasten-core
        run: cargo build --release --locked --features all

      - name: Set FASTEN_CORE_LIB
        run: |
          echo "FASTEN_CORE_LIB=$GITHUB_WORKSPACE/fasten-core/target/release/libfasten_core.so" \
            >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dev dependencies
        run: |
          uv venv
          # fastapi is its own extra; without it every reader test hits
          # importorskip("fastapi") and the whole P1-44/P1-45 suite
          # skips while CI still reports green.
          uv pip install -e ".[dev,postgres,fastapi,sqlite]"

      - name: Activate venv for subsequent steps
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint (ruff)
        run: ruff check fasten/

      - name: Type check (mypy)
        run: mypy fasten/

      - name: Unit tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/fasten-core/target/release
          FASTEN_TEST_POSTGRES_DSN: postgresql://fasten:fasten@localhost:5432/fasten_test
        run: pytest tests/ -v --tb=short --cov=fasten --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: python/coverage.xml
          flags: python
          fail_ci_if_error: false

      - name: Audit (pip-audit)
        # Run pip-audit from its own env so it audits the project venv and
        # not its own dependencies (filelock has no fixed release for 3.10).
        # Fail if site-packages isn't found; --path on a missing dir passes.
        run: |
          sp=$(echo .venv/lib/python3*/site-packages)
          test -d "$sp" || { echo "::error::site-packages not found at $sp, audit would pass without checking anything"; exit 1; }
          uvx pip-audit@2.10.1 --path "$sp"
