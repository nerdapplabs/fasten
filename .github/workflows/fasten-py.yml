name: Python SDK

on:
  # Restrict push to main + dev so PR branches don't run the suite
  # twice (once for push, once for pull_request) on every commit.
  push:
    branches: [main, dev]
    paths:
      - 'python/**'
      - '.github/workflows/fasten-py.yml'
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/fasten-py.yml'

permissions:
  contents: read
  id-token: write   # required by codecov OIDC upload (tokenless for public repos)

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.10-slim

    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      # `uv venv` creates a venv without pip, so pip-audit only scans
      # fasten's actual deps (zero) — no toolchain-CVE noise.
      - name: Install dev dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Activate venv for subsequent steps
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint (ruff)
        run: ruff check fasten/

      - name: Type check (mypy)
        run: mypy fasten/

      - name: Unit tests
        run: pytest tests/ -v --tb=short --cov=fasten --cov-report=xml --cov-report=term-missing

      - name: Install Codecov runtime deps
        run: apt-get update -qq && apt-get install -y --no-install-recommends git curl gpg

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: python/coverage.xml
          flags: python
          fail_ci_if_error: false

      - name: Audit (pip-audit)
        run: pip-audit
