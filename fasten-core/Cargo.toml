[package]
name = "fasten-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "Shared audit-store + drainer library: C ABI, SQLite + PostgreSQL 15+ backends, all fasten language SDKs"
repository = "https://github.com/nerdapplabs/fasten"
homepage = "https://fasten.sh"
keywords = ["audit", "sqlite", "postgres", "ffi", "observability"]
categories = ["development-tools::debugging"]

[lib]
name = "fasten_core"
# cdylib: .so / .dylib / .dll for the SDKs that load the C ABI
# staticlib: .a for linking into a single binary
# rlib: for the Rust SDK and tests
crate-type = ["cdylib", "staticlib", "rlib"]

# rusqlite "bundled" compiles SQLite from source, so there is no system
# libsqlite3 dependency (a C compiler for the target is still needed).
# postgres is a pure-Rust client with no libpq dependency.

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "1"
chrono     = { version = "0.4", features = ["clock"] }
regex      = "1"

# SQLite backend, bundled.
rusqlite = { version = "0.31", features = ["bundled"], optional = true }

# PostgreSQL 15+ backend. Tested against PG 15 and 16.
pg = { package = "postgres", version = "0.19", optional = true }

# TLS for the Postgres connector (`postgres-tls`, on by default), so a DSN
# with `sslmode=require` negotiates TLS.
native-tls           = { version = "0.2", optional = true }
postgres-native-tls  = { version = "0.5", optional = true }

[features]
default       = ["sqlite", "postgres", "postgres-tls"]
sqlite        = ["dep:rusqlite"]
postgres      = ["dep:pg"]
postgres-tls  = ["postgres", "dep:native-tls", "dep:postgres-native-tls"]
# `all` is kept for existing build scripts.
all           = ["sqlite", "postgres", "postgres-tls"]

[dev-dependencies]

[profile.release]
opt-level = 3
lto       = "thin"
strip     = true
