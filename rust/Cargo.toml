[package]
name = "fasten"
version = "0.1.0-alpha.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Audit + correlation SDK — 5 Ws + H anchors, one request_id across every transport"
repository = "https://github.com/nerdapplabs/fasten"
homepage = "https://fasten.sh"
readme = "../README.md"
keywords = ["audit", "logging", "correlation", "observability", "compliance"]
categories = ["development-tools::debugging", "asynchronous"]

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
chrono      = { version = "0.4", features = ["serde"] }
uuid        = { version = "1", features = ["v4"] }
tokio       = { version = "1", features = ["rt", "macros", "sync"], optional = true }
tracing     = { version = "0.1", optional = true }
sqlx        = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "chrono"], optional = true }

[features]
default = []
async = ["tokio"]
store-sqlite = ["sqlx"]
store-postgres = ["sqlx"]
shim-tracing = ["tracing"]
