[package]
name = "fasten"
version = "1.0.0-beta.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Audit + correlation SDK — 5 Ws + H anchors, one request_id across every transport"
repository = "https://github.com/nerdapplabs/fasten"
homepage = "https://fasten.sh"
readme = "../README.md"
keywords = ["audit", "logging", "correlation", "observability", "compliance"]
categories = ["development-tools::debugging", "asynchronous"]

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
chrono      = { version = "0.4", features = ["serde"] }
uuid        = { version = "1", features = ["v4"] }
tokio       = { version = "1", features = ["rt", "macros", "sync"], optional = true }
tracing     = { version = "0.1", optional = true }
sqlx        = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"], optional = true }
# `postgres` (sync client, MIT) is the right choice for `store-postgres`:
# `AuditStore` is a sync trait; sqlx is async-only and block_on() panics when
# called from inside an existing tokio runtime. `postgres` 0.19 is pure-sync,
# does not require openssl when using NoTls, and has no GPL/LGPL transitive deps.
pg          = { package = "postgres", version = "0.19", optional = true }
serde_yaml  = { version = "0.9", optional = true }

[features]
default = []
async = ["tokio"]
store-sqlite = ["sqlx"]
store-postgres = ["dep:pg"]
shim-tracing = ["tracing"]
codes-yaml = ["serde_yaml"]

[dev-dependencies]
serde_yaml  = "0.9"
tiny_http   = "0.12"   # for the examples/server.rs demo only
