[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fasten"
version = "0.1.0"
description = "Audit + correlation SDK — 5 Ws + H anchors, one request_id across every transport"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "nerdAppLabs", email = "praveen.garg@nerdapplabs.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Logging",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
sqlite = []                                   # uses stdlib sqlite3
postgres = ["psycopg[binary]>=3.1"]
fastapi = ["fastapi>=0.100", "starlette>=0.27"]
mqtt = ["paho-mqtt>=2.0"]
tui = ["rich>=13"]
structlog = ["structlog>=25.5.0"]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.10", "pip-audit>=2.7"]

[project.scripts]
fasten     = "fasten.cli:main"
fasten-tui = "fasten.tui.app:main"

[project.urls]
Homepage      = "https://fasten.sh"
Repository    = "https://github.com/nerdapplabs/fasten"
Documentation = "https://github.com/nerdapplabs/fasten/blob/main/README.md"

[tool.hatch.build.targets.wheel]
packages = ["fasten"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
