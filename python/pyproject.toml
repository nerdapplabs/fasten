[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rivet"
version = "0.1.0"
description = "Audit + correlation SDK — 5 Ws + H anchors, one request_id across every transport"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "nerdAppLabs", email = "praveen.garg@nerdapplabs.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Logging",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
sqlite = []                                   # uses stdlib sqlite3
postgres = ["psycopg[binary]>=3.1"]
fastapi = ["fastapi>=0.100", "starlette>=0.27"]
mqtt = ["paho-mqtt>=2.0"]
tui = ["rich>=13"]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
rivet = "rivet.cli:main"

[project.urls]
Homepage = "https://rivet.dev"
Repository = "https://github.com/nerdapplabs/rivet"
Plan      = "https://github.com/nerdapplabs/rivet/blob/main/README.md"

[tool.hatch.build.targets.wheel]
packages = ["rivet"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
