[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fasten"
version = "1.0.0b0"
description = "Audit + correlation SDK — 5 Ws + H anchors, one request_id across every transport"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "nerdAppLabs", email = "praveen.garg@nerdapplabs.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Logging",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
sqlite = []                                   # uses stdlib sqlite3
postgres = ["psycopg[binary]>=3.3.4"]
fastapi = ["fastapi>=0.100", "starlette>=0.27"]
mqtt = ["paho-mqtt>=2.1.0"]
tui = ["rich>=15.0.0"]
structlog = ["structlog>=25.5.0"]
dev = ["pytest>=7", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.20.2", "types-PyYAML>=6", "pip-audit>=2.10.0"]

[project.scripts]
fasten     = "fasten.cli:main"
fasten-tui = "fasten.tui.app:main"

[project.urls]
Homepage      = "https://fasten.sh"
Repository    = "https://github.com/nerdapplabs/fasten"
Documentation = "https://github.com/nerdapplabs/fasten/blob/main/README.md"

[tool.hatch.build.targets.wheel]
packages = ["fasten"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["fasten"]
omit = [
  "fasten/cli/*",
  "fasten/tui/*",
  "fasten/shim/*",
  "fasten/codes_yaml.py",
  "fasten/reader/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.coverage.xml]
output = "coverage.xml"
