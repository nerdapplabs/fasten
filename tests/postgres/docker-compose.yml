version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fasten_test
      POSTGRES_USER: fasten
      POSTGRES_PASSWORD: fasten
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fasten -d fasten_test"]
      interval: 2s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: bitnami/pgbouncer:1.21.0
    environment:
      PGBOUNCER_DATABASE: fasten_test
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 200
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
      PGBOUNCER_SERVER_IDLE_TIMEOUT: 10
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: fasten
      POSTGRESQL_PASSWORD: fasten
      POSTGRESQL_DATABASE: fasten_test
    ports:
      - "5433:5432"
    depends_on:
      postgres:
        condition: service_healthy

  postgres-replica:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fasten_test
      POSTGRES_USER: fasten
      POSTGRES_PASSWORD: fasten
      POSTGRES_REPLICA_OF: postgres
    ports:
      - "5434:5432"
    depends_on:
      - postgres
    command: >
      bash -c "
        until pg_isready -h postgres -U fasten; do sleep 1; done;
        PGPASSWORD=fasten pg_basebackup -h postgres -D /var/lib/postgresql/data
          -U fasten -Fp -Xs -P -R &&
        postgres
      "
