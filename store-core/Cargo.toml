[package]
name = "fasten-store-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Shared audit-store library — C ABI, SQLite + PostgreSQL 15+ backends, all fasten language SDKs"
repository = "https://github.com/nerdapplabs/fasten"
homepage = "https://fasten.sh"
keywords = ["audit", "sqlite", "postgres", "ffi", "observability"]
categories = ["development-tools::debugging"]

[lib]
name = "fasten_store_core"
# cdylib  → .so / .dylib / .dll  (for Python, Node, Go, C++, Swift via C ABI)
# staticlib → .a  (for embedding in a single binary, e.g. a CLI tool)
# rlib    → used by Rust unit tests and doctests
crate-type = ["cdylib", "staticlib", "rlib"]

# ── Dependencies ──────────────────────────────────────────────────────────────
#
# Architecture policy:
#   - rusqlite "bundled": compiles SQLite from source; no system libsqlite3 dep.
#     Requires a C compiler for the target (standard in all cross-toolchains).
#     Tested: x86_64-linux, aarch64-linux, x86_64-darwin, aarch64-darwin.
#   - postgres 0.19: pure-Rust PostgreSQL wire-protocol client. Zero C deps,
#     zero libpq dep. Cross-compiles to any Rust target with no extra setup.
#
# License scorecard (BOM / Snyk / Vanta):
#   serde        Apache-2.0 / MIT
#   serde_json   Apache-2.0 / MIT
#   thiserror    Apache-2.0 / MIT
#   rusqlite     MIT
#   SQLite       public domain (bundled)
#   postgres     MIT

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "1"
chrono     = { version = "0.4", features = ["clock"] }

# SQLite backend — bundled so no system libsqlite3 is required.
rusqlite = { version = "0.31", features = ["bundled"], optional = true }

# PostgreSQL 15+ backend — pure-Rust wire protocol, no libpq.
# Tested against PG 15.x and 16.x; wire protocol 3.0 is compatible
# with all PG versions ≥ 7.4, including PG 17.
pg = { package = "postgres", version = "0.19", optional = true }

[features]
default  = ["sqlite"]
sqlite   = ["dep:rusqlite"]
postgres = ["dep:pg"]
all      = ["sqlite", "postgres"]

[dev-dependencies]
# No additional dev deps — unit tests use only std + the crate's own types.

[profile.release]
opt-level = 3
lto       = "thin"   # thin-LTO: good balance of compile time vs binary size
strip     = true     # strip symbols from the cdylib; cuts ~30% off .so size
